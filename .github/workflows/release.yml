# Builds OmniBlu and publishes a GitHub release when a version tag is pushed, for example: git tag v0.1.0 && git push origin v0.1.0
# A tag with a dash (v0.2.0-beta.1) is published as a pre-release.
#
# It can also be started by hand (Actions tab > Release > Run workflow). That is a dry run: it builds, tests, publishes and
# zips the program, but it makes no release and no tag. Tick the box to keep the zip file as a workflow artifact.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload-artifact:
        description: "Keep the zip file as a workflow artifact (3 days). No tag and no release are made."
        type: boolean
        default: false

permissions:
  contents: write # needed to create the release and upload the files

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read the version from the tag
        id: version
        shell: pwsh
        run: |
          # A manual run has no tag, so it uses a made-up version that cannot be mistaken for a real one.
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "manual"
            $version = "0.0.0-manual.${{ github.run_number }}"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "The tag '$tag' is not a version like v1.2.3 or v1.2.3-beta.1."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Build and test
        run: dotnet test OmniBlu.slnx -c Release

      # One file (OmniBlu.exe) that contains .NET, so the user does not need to install it.
      # The .pdb files of the graphics libraries are about 100 MB and are not needed.
      - name: Publish
        run: >
          dotnet publish OmniBlu/OmniBlu.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Create the zip file
        id: package
        shell: pwsh
        run: |
          $name = "OmniBlu-${{ steps.version.outputs.version }}-win-x64"
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item publish/OmniBlu.exe package/
          Copy-Item LICENSE, README.md package/ -ErrorAction SilentlyContinue
          Compress-Archive -Path package/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Keep the zip file (manual run, if asked)
        if: github.event_name == 'workflow_dispatch' && inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.zip
            ${{ steps.package.outputs.name }}.zip.sha256
          retention-days: 3

      # Only a pushed tag makes a release. A manual run stops before this step.
      - name: Publish the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @(
            "release", "create", "${{ github.ref_name }}",
            "${{ steps.package.outputs.name }}.zip",
            "${{ steps.package.outputs.name }}.zip.sha256",
            "--title", "OmniBlu ${{ steps.version.outputs.version }}",
            "--generate-notes",
            "--verify-tag"
          )
          if ("${{ steps.version.outputs.prerelease }}" -eq "true") { $ghArgs += "--prerelease" }
          gh @ghArgs
